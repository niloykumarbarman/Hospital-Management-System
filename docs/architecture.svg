<svg width="700" height="410" viewBox="0 0 700 410" xmlns="http://www.w3.org/2000/svg" role="img">
<title>HMS backend Clean Architecture dependency flow</title>
<rect width="700" height="410" fill="#ffffff"/>

<rect x="240" y="30" width="220" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="350" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0C447C">HMS.API</text>
<text x="350" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">Controllers, middleware</text>

<rect x="240" y="170" width="220" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="350" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">HMS.Application</text>
<text x="350" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">DTOs, services, validators</text>

<rect x="240" y="310" width="220" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="350" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">HMS.Domain</text>
<text x="350" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Entities, no dependencies</text>

<rect x="470" y="235" width="190" height="70" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="565" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#712B13">HMS.Infrastructure</text>
<text x="565" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#993C1D">EF Core, repositories</text>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-dash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="350" y1="90" x2="350" y2="170" stroke="#444441" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="350" y1="230" x2="350" y2="310" stroke="#444441" stroke-width="1" marker-end="url(#arrow)"/>

<path d="M470 250 L460 200" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow-dash)"/>
<path d="M470 290 L460 340" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow-dash)"/>

<text x="480" y="220" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">implements</text>
<text x="480" y="320" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">implements</text>
</svg>
